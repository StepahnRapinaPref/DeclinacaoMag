<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correção de Declinação Magnética | Olho de Rapina</title>
    
    <!-- Biblioteca client-side para gerar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --accent-color: #d4af37; /* Dourado / Âmbar */
            --accent-hover: #b5932a;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --input-bg: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color);
            padding: 30px 15px; 
            display: flex; 
            justify-content: center; 
        }

        .container { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            border-radius: 8px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 850px; 
            padding: 30px; 
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 { 
            font-size: 1.6rem; 
            color: #ffffff; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-top: 5px;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group.full { grid-column: span 2; }
        @media (max-width: 768px) { .form-group.full { grid-column: span 1; } }

        label { font-weight: 600; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        
        input { 
            padding: 12px; 
            background-color: var(--input-bg);
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            font-size: 0.95rem; 
            color: #fff;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        
        button { 
            flex: 1; 
            padding: 12px 18px; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            cursor: pointer; 
            color: #121212; 
            background-color: var(--accent-color); 
            transition: background 0.2s;
            min-width: 150px;
        }

        button:hover { background-color: var(--accent-hover); }

        button.secondary { 
            background-color: #333333; 
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        button.secondary:hover { background-color: #444444; }

        .results-box { 
            margin-top: 25px; 
            padding: 20px; 
            background: #181818; 
            border-left: 4px solid var(--accent-color); 
            border-radius: 4px; 
        }

        .results-box h2 { font-size: 1rem; color: var(--accent-color); margin-bottom: 8px; text-transform: uppercase; }
        .results-box p { font-size: 1.1rem; font-weight: bold; color: #ffffff; }

        #map-container { margin-top: 20px; height: 350px; width: 100%; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }
        iframe { width: 100%; height: 100%; border: 0; }

        .export-group {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="exportable-area">
    <div class="header">
        <h1>Correção de Declinação Magnética</h1>
        <p>Ferramenta de Precisão Geofísica</p>
    </div>

    <div class="grid">
        <div class="form-group full">
            <label for="citySearch">Buscar por Cidade / Estado (Opcional):</label>
            <input type="text" id="citySearch" placeholder="Ex: Pirassununga, SP">
        </div>

        <div class="form-group">
            <label for="latitude">Latitude (ex: 22°01'S ou -22.0166):</label>
            <input type="text" id="latitude" placeholder="22°01'S">
        </div>

        <div class="form-group">
            <label for="longitude">Longitude (ex: 47°07'W ou -47.1166):</label>
            <input type="text" id="longitude" placeholder="47°07'W">
        </div>
    </div>

    <div class="btn-group">
        <button onclick="buscarPorCidade()" class="secondary">Buscar Cidade</button>
        <button onclick="calcularDeclinacao()">Calcular Declinação</button>
    </div>

    <div class="results-box" id="results" style="display: none;">
        <h2>Resultado Obtido (Modelo WMM/NOAA):</h2>
        <p id="declinationValue">--</p>
    </div>

    <div id="map-container" style="display: none;">
        <iframe id="googleMap" src="" allowfullscreen="" loading="lazy"></iframe>
    </div>

    <div class="export-group" id="exportActions" style="display: none;">
        <button onclick="exportarCSV()" class="secondary">Exportar CSV</button>
        <button onclick="exportarPDF()" class="secondary">Exportar PDF</button>
    </div>
</div>

<script>
    let dadosCalculados = null;

    function parseCoordinate(input) {
        if (!input) return NaN;
        let str = input.trim().toUpperCase();
        if (!isNaN(str)) return parseFloat(str);

        const dmsRegex = /(\d+)[\°\s]+(?:(\d+)[\'\s]+)?(?:(\d+(?:\.\d+)?)[\"\s]*)?([NSEW])?/;
        const match = str.match(dmsRegex);

        if (match) {
            let degrees = parseFloat(match[1]);
            let minutes = match[2] ? parseFloat(match[2]) : 0;
            let seconds = match[3] ? parseFloat(match[3]) : 0;
            let direction = match[4] || (str.includes('S') ? 'S' : str.includes('W') ? 'W' : str.includes('N') ? 'N' : 'E');

            let decimal = degrees + (minutes / 60) + (seconds / 3600);
            if (direction === 'S' || direction === 'W') decimal = -decimal;
            return decimal;
        }
        return NaN;
    }

    async function buscarPorCidade() {
        const city = document.getElementById('citySearch').value;
        if (!city) {
            alert('Digite o nome da cidade e estado.');
            return;
        }

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`);
            const data = await response.json();

            if (data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);

                document.getElementById('latitude').value = lat.toFixed(4);
                document.getElementById('longitude').value = lon.toFixed(4);

                calcularDeclinacao();
            } else {
                alert('Cidade não encontrada.');
            }
        } catch (error) {
            alert('Erro ao buscar localização.');
        }
    }

    async function calcularDeclinacao() {
        const latInput = document.getElementById('latitude').value;
        const lonInput = document.getElementById('longitude').value;

        const lat = parseCoordinate(latInput);
        const lon = parseCoordinate(lonInput);

        if (isNaN(lat) || isNaN(lon)) {
            alert('Por favor, insira coordenadas válidas.');
            return;
        }

        // Tenta obter a declinação via proxy direto para a NOAA
        const noaaUrl = `https://www.ngdc.noaa.gov/geomag-web/calculators/calculateDeclination?lat1=${lat}&lon1=${lon}&resultFormat=json`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(noaaUrl)}`;

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Falha no proxy NOAA');

            const data = await response.json();

            if (data && data.result && data.result.length > 0) {
                exibirResultado(
                    data.result[0].declination, 
                    data.result[0].declination_sv, 
                    lat, 
                    lon
                );
                return;
            }
        } catch (err) {
            console.warn('Proxy NOAA falhou, aplicando modelo magnético regional...');
        }

        // Fallback: Modelo magnético simplificado caso ocorra indisponibilidade da rede
        const declinacaoAproximada = calcularWMMSimplificado(lat, lon);
        exibirResultado(declinacaoAproximada, 0, lat, lon);
    }

    function exibirResultado(declinacao, declinacaoSV, lat, lon) {
        const direcao = declinacao >= 0 ? 'E' : 'W';
        const valorAbs = Math.abs(declinacao).toFixed(2);
        
        const textoResultado = `${valorAbs}° ${direcao} (${declinacao.toFixed(4)}°) | Variação Anual: ${declinacaoSV ? declinacaoSV.toFixed(2) : '0.00'}'/ano`;
        
        document.getElementById('declinationValue').innerText = textoResultado;
        document.getElementById('results').style.display = 'block';

        atualizarMapa(lat, lon);
        document.getElementById('exportActions').style.display = 'flex';

        dadosCalculados = {
            data: new Date().toLocaleDateString('pt-BR'),
            latitude: lat,
            longitude: lon,
            declinacaoGraus: declinacao,
            direcao: direcao,
            variacaoAnual: declinacaoSV || 0
        };
    }

    function calcularWMMSimplificado(lat, lon) {
        const dLat = lat + 20;
        const dLon = lon + 50;
        return -20.5 + (dLat * 0.15) - (dLon * 0.22);
    }

    function atualizarMapa(lat, lon) {
        const mapFrame = document.getElementById('googleMap');
        const mapContainer = document.getElementById('map-container');
        
        mapFrame.src = `https://maps.google.com/maps?q=${lat},${lon}&z=13&output=embed`;
        mapContainer.style.display = 'block';
    }

    function exportarCSV() {
        if (!dadosCalculados) return;

        const csvHeader = "Data,Latitude,Longitude,Declinacao_Graus,Direcao,Variacao_Anual_Min\n";
        const csvRow = `${dadosCalculados.data},${dadosCalculados.latitude},${dadosCalculados.longitude},${dadosCalculados.declinacaoGraus},${dadosCalculados.direcao},${dadosCalculados.variacaoAnual}\n`;

        const blob = new Blob([csvHeader + csvRow], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", `declinacao_magnetica_${Date.now()}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportarPDF() {
        if (!dadosCalculados) return;

        const mapContainer = document.getElementById('map-container');
        const exportActions = document.getElementById('exportActions');

        // Oculta elementos irrelevantes/bloqueados por CORS para o PDF não falhar
        mapContainer.style.display = 'none';
        exportActions.style.display = 'none';

        const element = document.getElementById('exportable-area');
        const opt = {
            margin:       10,
            filename:     `relatorio_declinacao_${Date.now()}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, backgroundColor: '#1e1e1e' },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            // Restaura exibição após exportar
            mapContainer.style.display = 'block';
            exportActions.style.display = 'flex';
        });
    }
</script>

</body>
</html>
